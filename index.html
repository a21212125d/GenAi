<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Using an embedded SVG to prevent 404 errors for the favicon -->

    <!-- Tailwind CSS via CDN -->

    <!-- Tailwind CSS Configuration to define custom brand colors used in the app -->

        theme: {

            colors: {
              'brand-primary': '#6366f1',   // Indigo 500
              'brand-secondary': '#ec4899', // Pink 500
            }
          }
        }

    </script>

    "react/": "https://aistudiocdn.com/react@^19.2.0/",

  }
}
</script>
</head>
  <body class="bg-slate-950 text-white">
